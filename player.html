
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamza Player</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #192235;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { color: #35d6a0; font-size: 22px; font-weight: bold; }
a { color: white; text-decoration: none; }
main { padding: 18px; max-width: 850px; margin: auto; }
.player {
  width: 100%;
  aspect-ratio: 16/9;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}
video {
  width: 100%;
  height: 100%;
}
h1 { font-size: 24px; }
.info {
  background: #192235;
  padding: 18px;
  border-radius: 12px;
  margin-top: 18px;
}
.ad {
  border: 1px dashed #64748b;
  padding: 25px;
  text-align: center;
  border-radius: 10px;
  margin: 20px 0;
  color: #9eabc0;
}
button {
  background: #35d6a0;
  color: #101522;
  border: 0;
  padding: 13px 20px;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>
<body>

<header>
<div class="logo">STREAMZA</div>
<a href="videos.html">← Videos</a>
</header>

<main>

<div class="player">
<video controls playsinline>
<source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
Your browser does not support video.
</video>
</div>

<div class="info">
<h1>Video Player</h1>
<p>Welcome to Streamza video player.</p>
<p>Videos will appear here when added to the library.</p>
</div>

<div class="ad">
Advertisement
<p>Ad space</p>
</div>

<button onclick="location.href='videos.html'">Back to Library</button>

</main>
</body>
</html>
