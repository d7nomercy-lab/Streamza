
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamza Videos</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #192235;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { color: #35d6a0; font-size: 22px; font-weight: bold; }
header a { color: white; text-decoration: none; }
main { padding: 20px; }
h1 { font-size: 26px; }
.search {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 0;
  background: #192235;
  color: white;
  margin: 15px 0;
}
.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 12px;
}
.categories button {
  background: #26334a;
  color: white;
  border: 0;
  border-radius: 20px;
  padding: 10px 18px;
  white-space: nowrap;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.video {
  background: #192235;
  border-radius: 12px;
  overflow: hidden;
}
.thumb {
  height: 120px;
  background: linear-gradient(135deg,#26334a,#35d6a0);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 35px;
}
.video h3 { padding: 0 10px; font-size: 15px; }
.video p { padding: 0 10px; color: #9eabc0; font-size: 12px; }
.video a {
  display: block;
  text-align: center;
  padding: 12px;
  background: #35d6a0;
  color: #101522;
  text-decoration: none;
  font-weight: bold;
}
.ad {
  margin: 22px 0;
  padding: 25px;
  border: 1px dashed #64748b;
  text-align: center;
  color: #9eabc0;
  border-radius: 10px;
}
</style>
</head>
<body>
<header>
<div class="logo">STREAMZA</div>
<a href="index.html">Home</a>
</header>
<main>
<h1>Video Library</h1>
<p>Discover videos you enjoy.</p>
<input class="search" id="search" placeholder="Search videos..." oninput="filterVideos()">
<div class="categories">
<button onclick="showCategory('All')">All</button>
<button onclick="showCategory('Entertainment')">Entertainment</button>
<button onclick="showCategory('Gaming')">Gaming</button>
<button onclick="showCategory('Education')">Education</button>
<button onclick="showCategory('Sports')">Sports</button>
</div>
<div class="ad">Advertisement<p>Ad space</p></div>
<div class="grid" id="grid">
<div class="video" data-category="Entertainment">
<div class="thumb">🎬</div>
<h3>Entertainment</h3>
<p>Discover entertainment videos</p>
<a href="player.html">Watch</a>
</div>
<div class="video" data-category="Gaming">
<div class="thumb">🎮</div>
<h3>Gaming</h3>
<p>Explore gaming videos</p>
<a href="player.html">Watch</a>
</div>
<div class="video" data-category="Education">
<div class="thumb">📚</div>
<h3>Education</h3>
<p>Learn something new</p>
<a href="player.html">Watch</a>
</div>
<div class="video" data-category="Sports">
<div class="thumb">⚽</div>
<h3>Sports</h3>
<p>Explore sports videos</p>
<a href="player.html">Watch</a>
</div>
</div>
<div class="ad">Advertisement<p>Ad space</p></div>
</main>
<script>
let currentCategory = "All";
function showCategory(category) {
currentCategory = category;
filterVideos();
}
function filterVideos() {
const search = document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".video").forEach(video => {
const title = video.querySelector("h3").textContent.toLowerCase();
const category = video.dataset.category;
const matchesSearch = title.includes(search);
const matchesCategory = currentCategory === "All" || category === currentCategory;
video.style.display = matchesSearch && matchesCategory ? "" : "none";
});
}
</script>
</body>
</html>
